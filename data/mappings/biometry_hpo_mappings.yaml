head_circumference:
  loinc:
    id: "LOINC:11984-2"
    label: "Fetal Head Circumference US"
  bins:
    - min: 0
      max: 3
      id: "HP:0000252"
      label: "Microcephaly"
      normal: false
    - min: 3
      max: 5
      id: "HP:0040195"
      label: "Decreased head circumference"
      normal: false
    - min: 5
      max: 10
      id: "HP:0000240"
      label: "Abnormality of skull size"
      normal: false
    - min: 10
      max: 50
      id: "HP:0000240"
      label: "Abnormality of skull size"
      normal: true
    - min: 50
      max: 90
      id: "HP:0000240"
      label: "Abnormality of skull size"
      normal: true
    - min: 90
      max: 95
      id: "HP:0000240"
      label: "Abnormality of skull size"
      normal: false
    - min: 95
      max: 97
      id: "HP:0040194"
      label: "Increased head circumference"
      normal: false
    - min: 97
      max: 100
      id: "HP:0000256"
      label: "Macrocephaly"
      normal: false

