# ---------------------------------------------------------------------------
# Further optional measurements recognised in Observer and/or ViewPoint
# exports. Of these, only Humerus carries a real percentile in Observer
# exports; Observer exports Nuchal Fold, Cerebellum, Cisterna Magna, Nasal
# Bone, the lateral ventricles and Biorbit with its "not calculated"
# placeholder (percentile 0, empty display text), which the Observer
# extractor skips. ViewPoint does calculate some of them (Cerebellum and
# Cisterna Magna percentiles appear in ViewPoint text exports), and both
# platforms are configurable per site, so all of them are mapped here.
#
# LOINC codes were checked against the NLM Clinical Tables LOINC search
# (https://clinicaltables.nlm.nih.gov/api/loinc_items/v3/search) and HPO
# terms against hp.json.
#
# TODO(@VarenyaJ): the bin assignments below are SCAFFOLDING only, same
# caveat as the sections above - they need clinical review.
# ---------------------------------------------------------------------------

