# Cluster mapping for the prenatalppkt data dictionary.
#
# Each entry maps one cluster name to (a) Observer dot-path
# prefixes and (b) EVMS GE HL7 OBX-3 identifier prefixes. A path /
# identifier routes to the FIRST cluster whose prefix list
# contains a string prefix of it; order matters when prefixes
# nest. Anything that matches nothing lands in `_unclustered` so
# nothing is silently dropped.

- cluster: biometry
  observer_prefixes:
    - fetuses[].measurements[]
    - fetuses[].measurements
    - fetuses[].ratios[]
    - fetuses[].ratios
    - fetuses[].efws[]
    - fetuses[].efws
    - fetuses[].firsttrimester
  viewpoint_prefixes:
    - SkullFetus
    - AbdomenFetus
    - ExtremitiesFetus
    - NeckSkinFetus
    - EmbryonicStructuresFetus
    - Fetus.EstimatedFetal
    - Fetus.VP_EstimatedFetal
    - Fetus.HeadCircumference
    - Fetus.FemurUndefinedLength
    - Fetus.BonyThoracicCircumference
    - Fetus.VP_HeadCircumference
    - Fetus.VP_FemurUndefinedLength
    - Fetus.VP_BonyThoracic
    - Fetus.HC
    - Fetus.FL
    - Fetus.BPD
    - U_FGRData_F_

