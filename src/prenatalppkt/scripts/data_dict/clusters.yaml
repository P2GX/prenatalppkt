# Cluster mapping for the prenatalppkt data dictionary (Plan 12).
#
# Each entry maps one cluster name to the Observer dot-path prefixes
# AND the EVMS GE HL7 OBX-3 identifier prefixes that fall under it.
# A path or identifier matches the first cluster whose prefix list
# contains a string prefix of that path/identifier. Anything that
# doesn't match lands in the `_unclustered` bucket so nothing is
# silently dropped.

- cluster: biometry
  observer_prefixes:
    - fetuses[].measurements
    - fetuses[].ratios
    - fetuses[].efws
    - fetuses[].firsttrimester
  viewpoint_prefixes:
    - SkullFetus
    - AbdomenFetus
    - ExtremitiesFetus
    - NeckSkinFetus
    - EmbryonicStructuresFetus
    - Fetus.EstimatedFetal
    - Fetus.VP_EstimatedFetal
    - Fetus.HeadCircumference
    - Fetus.FemurUndefinedLength
    - Fetus.BonyThoracicCircumference
    - Fetus.VP_HeadCircumference
    - Fetus.VP_FemurUndefinedLength
    - Fetus.VP_BonyThoracic
    - Fetus.HC
    - Fetus.FL
    - Fetus.BPD
    - U_FGRData_F_

- cluster: cardiac
  observer_prefixes:
    - fetuses[].fetal_echo_anatomy
    - fetuses[].fetal_echo_measurements
    - fetuses[].dm_echo
    - fetuses[].fetus.heart
    - fetuses[].fetus.cardiac
  viewpoint_prefixes:
    - HeartFetus
    - FetalEchocardiography
    - ChestFetus.Cardiac
    - ChestFetus.DuctusArteriosus
    - ChestFetus.Thoracic

- cluster: anatomy
