[build-system]
requires = ["setuptools>=80.9.0", "wheel==0.45.1", "setuptools_scm==8.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "prenatalppkt"
description = "Prenatal phenopacket library"
authors = [
  { name = "Varenya Jain" },
  { name = "Peter N. Robinson" },
]
requires-python = ">=3.10"
# dynamic = ["dependencies", "version"]
dynamic = ["version"]
license = { file = "LICENSE" }
readme = "README.md"

# inherited from requirements/requirements.txt and requirements/requirements_test.txt
dependencies = [
 "click==8.2.1",
 #"hpo-toolkit==0.7.0",
 "hpo-toolkit==0.5.5",
 "ijson==3.4.0",
 "jsonschema==4.25.1",
 "openpyxl==3.1.5",
 "orjson==3.11.9",
 "pandas==2.3.2",
 "phenopackets==2.0.2.post5",
 "protobuf==3.20.3",
 "python-calamine==0.5.3",
 "PyYAML==6.0.2",
 "requests==2.34.2",
 "rich==14.1.0",
 "stairval==0.2.1",
 #"typer==0.17.4",
 "fenominal==0.2.17",
]

[project.optional-dependencies]
dev = [
 "pytest==8.4.0",
 "ruff==0.12.4",
 "ipykernel",
 "pre-commit>=3.7",
]
ocr = [
 "docling==2.53.0", # lxml version that already has prebuilt binary wheels; pulls in torch/CUDA (~3GB)
]
docs = [
    "sphinx>=7.4,<9",
    "myst-parser>=3.0,<5",
    "sphinx-rtd-theme>=1.3,<4",
    "sphinx-autodoc-typehints>=2.2,<4",
    "sphinx-copybutton>=0.5,<1",
    "linkify-it-py>=2.0,<3",
]

[project.urls]
homepage = "https://github.com/P2GX/prenatalppkt/"
repository = "https://github.com/P2GX/prenatalppkt/.git"
documentation = "https://github.com/P2GX/prenatalppkt/"
bugtracker = "https://github.com/P2GX/prenatalppkt/issues"

[project.scripts]
prenatalppkt = "prenatalppkt.cli:main"


[tool.setuptools]
packages.find = { where = ["src"] }

[tool.setuptools_scm]
version_file = "src/prenatalppkt/_version.py"

[tool.setuptools.dynamic]
version = { attr = "prenatalppkt._version.version" }
# dependencies = {file = ["requirements/requirements.txt"]}
