name: Build MkDocs In-Place (Stable & Develop)
on:
 push:
   branches:
     - main
     - develop
     - vj/cleandocs

jobs:
 build-docs:
   if: github.actor != 'github-actions[bot]'  # Prevents rebuild loops
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'

     - name: Install MkDocs and dependencies
       run: pip install .[docs]

     - name: Build MkDocs site into docs/
       run: mkdocs build --site-dir docs

     - name: Commit and push built docs
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         git config user.name "${GITHUB_ACTOR}"
         git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
         git add docs
         git diff --quiet && git diff --staged --quiet || git commit -m "Update docs for ${GITHUB_REF_NAME}"
         git push