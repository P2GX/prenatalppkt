name: Deploy MkDocs to GitHub Pages
on:
 push:
   branches: [ main, develop, vj/cleandocs ]

permissions:
 contents: write        # allows mkdocs deploy to push pages
 pages: write
 id-token: write

jobs:
 build-deploy:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'

     - name: Install MkDocs + plugins
       run: pip install .[docs]

     # Build MkDocs site; output to branch-specific subfolder
     - name: Build docs
       run: |
         BRANCH=${GITHUB_REF_NAME}
         SITE_DIR="site/${BRANCH}"
         mkdocs build --site-dir "${SITE_DIR}"

     # Deploy with built-in token; no PAT or deploy key required
     - name: Deploy to GitHub Pages
       uses: peaceiris/actions-gh-pages@v4
       with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_dir: ./site